name: build VAuthenticator Management UI

on:
  push: { }
  workflow_dispatch:
    inputs:
      version:
        description: 'make a tag'
        required: false

      newversion:
        description: 'Next desired version'
        required: true
        type: string
jobs:
  tag-artifact:
    if: github.event.inputs.version != ''
    needs:
      - build-backend

    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: set the Tag version
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          cd management-ui/src

          git config --global user.email "${{ secrets.GIT_EMAIL }}"
          git config --global user.name "${{ secrets.GIT_USERNAME }}"

          npm pkg set version="$RELEASE_VERSION"
          git commit -am "[skip-ci] new version release $RELEASE_VERSION"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create tag
        uses: ncipollo/release-action@v1
        with:
          bodyFile: changelog/${{ github.event.inputs.version }}.md
          tag: ${{ github.event.inputs.version }}

      - name: set the Next Development version
        if: github.event.inputs.newversion != ''
        env:
          NEXT_VERSION: ${{ github.event.inputs.newversion }}
        run: |
          cd management-ui/src

          git config --global user.email "${{ secrets.GIT_EMAIL }}"
          git config --global user.name "${{ secrets.GIT_USERNAME }}"

          npm pkg set version="$NEXT_VERSION"
          git commit -am "[skip-ci] new version release $NEXT_VERSION"
          git push origin HEAD:${{ github.ref_name }}

  build-backend:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: |
          cd management-ui
          ./production-build.sh

      - name: docker push
        run: |
          docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_PASSWORD }}

          if [[ ${GITHUB_REF##*/} == 'main' ]]
          then
            DOCKER_TAG="latest"
          else
            DOCKER_TAG="${GITHUB_REF##*/}"
          fi
          cd management-ui

          echo "$DOCKER_TAG"
          docker build -t mrflick72/vauthenticator-management-ui-k8s:$DOCKER_TAG -f Dockerfile .
          docker push mrflick72/vauthenticator-management-ui-k8s:$DOCKER_TAG

      - name: Docker tag
        if: github.event.inputs.version != ''
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          cd management-ui

          DOCKER_TAG="$RELEASE_VERSION"
          docker build -t mrflick72/vauthenticator-management-ui-k8s:$DOCKER_TAG -f Dockerfile .
          docker push mrflick72/vauthenticator-management-ui-k8s:$DOCKER_TAG
