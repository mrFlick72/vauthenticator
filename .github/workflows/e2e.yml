name: VAuthenticator e2e tests

on:
  pull_request: { }

jobs:
  e2e:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'corretto'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: local hosts
        run: |
          echo "127.0.0.1 local.api.vauthenticator.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 local.management.vauthenticator.com" | sudo tee -a /etc/hosts

      - name: install playwright browser
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium

      - name: run e2e
        run: |
          cd e2e
          ./run.sh

      - name: upload playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
