name: build VAuthenticator Auth Server

on:
  workflow_call: { }
  push: { }

jobs:
  build-backend:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:14-alpine
        ports:
          - "5432:5432"
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
      localstack:
        image: localstack/localstack:3.2
        ports:
          - "4566-4599:4566-4599"
        env:
          SERVICES: s3,kms,dynamodb,sns
      redis:
        image: redis
        ports:
          - "6379:6379"
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'corretto'

      # the root aggregator builds the platform and auth-server in one reactor (docs/adr/0001)
      - name: Build
        run: |
          mvn install -q

      - name: docker push
        run: |
          cd auth-server

          docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_PASSWORD }}
          
          if [[ ${GITHUB_REF##*/} == 'main' ]]
          then
            DOCKER_TAG="latest"
          else
            DOCKER_TAG="${GITHUB_REF##*/}"
          fi
          
          echo "$DOCKER_TAG"
          docker build -t mrflick72/vauthenticator-k8s:$DOCKER_TAG -f application.Dockerfile .
          ./check-jdk-floor.sh mrflick72/vauthenticator-k8s:$DOCKER_TAG 25.0.5.1
          docker push mrflick72/vauthenticator-k8s:$DOCKER_TAG
