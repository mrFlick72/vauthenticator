name: build VAuthenticator Auth Server

on:
  push: { }
  workflow_dispatch:
    inputs:
      version:
        description: 'make a tag'
        required: false
        type: string

      newversion:
        description: 'Next desired version'
        required: false
        type: string

jobs:
  tag-artifact:
    if: github.event.inputs.version != ''
    needs:
      - build-backend
      - ui-backend

    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'corretto'

      - name: set the Tag version
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          cd auth-server

          git config --global user.email "${{ secrets.GIT_EMAIL }}"
          git config --global user.name "${{ secrets.GIT_USERNAME }}"

          mvn versions:set -DnewVersion="$RELEASE_VERSION"
          git commit -am "[skip-ci] new version release $RELEASE_VERSION"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create tag
        uses: ncipollo/release-action@v1
        with:
          bodyFile: changelog/${{ github.event.inputs.version }}.md
          tag: ${{ github.event.inputs.version }}

      - name: set the Next Development version
        if: github.event.inputs.newversion != ''
        env:
          NEXT_VERSION: ${{ github.event.inputs.newversion }}
        run: |
          cd auth-server

          git config --global user.email "${{ secrets.GIT_EMAIL }}"
          git config --global user.name "${{ secrets.GIT_USERNAME }}"

          mvn versions:set -DnewVersion="$NEXT_VERSION"
          git commit -am "[skip-ci] new version release $NEXT_VERSION"
          git push origin HEAD:${{ github.ref_name }}

  build-backend:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:14-alpine
        ports:
          - "5432:5432"
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
      localstack:
        image: localstack/localstack:3.2
        ports:
          - "4566-4599:4566-4599"
        env:
          SERVICES: s3,kms,dynamodb,sns
      redis:
        image: redis
        ports:
          - "6379:6379"
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'corretto'

      - name: Build
        run: |
          cd auth-server
          mvn install -q

      - name: docker push
        run: |
          cd auth-server

          docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_PASSWORD }}
          
          if [[ ${GITHUB_REF##*/} == 'main' ]]
          then
            DOCKER_TAG="latest"
          else
            DOCKER_TAG="${GITHUB_REF##*/}"
          fi
          
          echo "$DOCKER_TAG"
          docker build -t mrflick72/vauthenticator-k8s:$DOCKER_TAG -f application.Dockerfile .
          docker push mrflick72/vauthenticator-k8s:$DOCKER_TAG

      - name: Docker tag
        if: github.event.inputs.version != ''
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          cd auth-server

          DOCKER_TAG="$RELEASE_VERSION"
          docker build -t mrflick72/vauthenticator-k8s:$DOCKER_TAG -f application.Dockerfile .
          docker push mrflick72/vauthenticator-k8s:$DOCKER_TAG
  ui-backend:
    runs-on: ubuntu-22.04

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: 21

      - name: Build frontend artifacts
        run: |
          cd auth-server

          cd src/main/frontend
          npm install --legacy-peer-deps
          npm run-script production-build