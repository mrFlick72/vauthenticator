imagePullSecrets: []

replicaCount: 1

image:
  repository: mrflick72/vauthenticator-config-manager-k8s
  pullPolicy: Always
  tag: "latest"

resources:
  requests:
    cpu: "50m"
    memory: "32Mi"
  limits:
    cpu: "100m"
    memory: "64Mi"

service:
  type: ClusterIP
  port: 8086

ingress:
  host: "*"
  annotations: { }
  tls: { }
  enabled: true
  class: nginx

gateway:
  enabled: false
  annotations: { }
  labels: { }
  parentRefs: [ ]
  hostnames: [ ]
  rules: [ ]

  # Example:
  # TLS/cert-manager is configured on the referenced Gateway listener, not on this HTTPRoute.
  # enabled: true
  # parentRefs:
  #   - name: traefik-gateway
  #     namespace: traefik
  #     sectionName: websecure # Optional: target a specific Gateway listener
  # hostnames:
  #   - config-manager.example.com # Should match the HTTPS listener hostname/certificate DNS name
  # rules:
  #   - matches:
  #       - path:
  #           type: PathPrefix
  #           value: /
  #     backendRefs:
  #       - name: config-manager
  #         port: 8086

pod:
  probes:
    liveness:
      initialDelaySeconds: 5
      periodSeconds: 30
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 30
  podAnnotations: { }

labels: { }

selectorLabels:
  app: vauthenticator-config-manager

# Configuration mapped 1:1 to the config-manager environment variables documented in
# config-manager/AGENTS.md. All values here are required by the service at startup except
# serverAddress, which defaults to ":8086" in the application itself.
application:
  serverAddress: ":8086"

  # Allowed CORS origin for /api/config. Must match the host the management UI is served from.
  managementUiServerUrl: http://management-ui-example-host.com

  idpBaseUrl: http://application-example-host.com
  clientApplicationId: vauthenticator-management-ui
  redirectUri: http://management-ui-example-host.com/callback
  authenticationCheckInterval: "15000"
  apiBaseUrl: http://application-example-host.com/api
