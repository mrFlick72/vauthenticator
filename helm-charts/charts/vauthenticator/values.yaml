in-namespace:
  redis:
    enabled: true
  db:
    enabled: true

postgresql:
  primary:
    initdb:
      scriptsConfigMap: vauthenticator-postgres-initdb

redis:
  auth:
    enabled: false
  replica:
    replicaCount: 1

aws:
  region: xxxxxxxxx
  iamUser:
    accessKey: xxxxxxxxx
    secretKey: xxxxxxxxx
    enabled: false
  eks:
    serviceAccount:
      enabled: false
      iamRole:
        arn: arn:aws:iam::ACCOUNT_ID:role/IAM_ROLE_NAME

imagePullSecrets: [ ]

keda:
  enabled: false
  spec:
    minReplicaCount: 1
    maxReplicaCount: 1
    pollingInterval: 1
    cooldownPeriod: 300
  prometheus:
    serverAddress: ""
    metricName: ""
    threshold: ""
    query: ""

pod:
  probes:
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 30
    rediness:
      initialDelaySeconds: 10
      periodSeconds: 30
  podAnnotations: { }



service:
  type: ClusterIP

ingress:
  host: "*"
  annotations: { }
  tls: { }
  enabled: true
  class: nginx

gateway:
  enabled: false

# Gateway API routing. gateway.enabled renders a Gateway resource; httpRoute.enabled
# renders an HTTPRoute bound to it via parentRefs. Enable both together to route
# through the Gateway API instead of the Ingress resource (ingress.enabled and
# httpRoute.enabled are mutually exclusive; the chart fails to render if both are true).
httpRoute:
  enabled: false
  gatewayClassName: traeefik
  gatewayPort: 8443
  hostnames: [ ]
  tls: [ ]
  annotations: { }
  rules: [ ]

  # Example:
  # gateway:
  #   enabled: true
  # httpRoute:
  #   enabled: true
  #   gatewayClassName: nginx
  #   gatewayPort: 443
  #   hostnames:
  #     - auth.example.com # Must match the HTTPS listener hostname/certificate DNS name
  #   tls:
  #     - secretName: auth-tls
  #   rules:
  #     - matches:
  #         - path:
  #             type: PathPrefix
  #             value: /


resources:
  requests:
    cpu: "256m"
    memory: "256Mi"
  limits:
    cpu: "512m"
    memory: "512Mi"
replicaCount: 1

image:
  repository: mrflick72/vauthenticator-k8s
  pullPolicy: Always
  tag: "latest"

labels: { }

selectorLabels:
  app: vauthenticator

application:
  sessionTimeout: 24h
  profiles: kms
  datasource:
    # Required: PostgreSQL is the only persistence.
    # Example:
    # url: jdbc:postgresql://db.local.vauthenticator.com:5432/
    # username: postgres
    # password: postgres
    url: ""
    username: ""
    password: ""
  password:
    history:
      evaluationLimit: 1
      maxHistoryAllowedSize: 3
    generatorCriteria:
      upperCaseCharactersSize: 2
      lowerCaseCharactersSize: 2
      specialCharactersSize: 2
      numberCharactersSize: 2
    policy:
      minSize: 1
      minSpecialSymbol: 1
      enablePasswordReusePrevention: true
    lifeCycle:
      # Spring cron expression (six fields, seconds first) for the password lifecycle job.
      cron: "0 0 * * * *"

  masterKey: ACCOUNT_KMS_KEY
  masterKeyContent: xxxxxxxxx

  redis:
    database: 0
    host: vauthenticator-redis-master.auth.svc.cluster.local

  server:
    port: 8080

  baseUrl: http://application-example-host.com

  emailProvider:
    host: localhost
    port: 587
    username: ""
    password: ""
    properties: { }

  email:
    from: ""
    welcomeEMailSubject: ""
    verificationEMailSubject: ""
    resetPasswordEMailSubject: ""
    mfaEMailSubject: ""

  role:
    protectedFromDelete: ROLE_USER,VAUTHENTICATOR_ADMIN

  # Opt-in Redis read-through caches; every account write evicts the account cache.
  cache:
    account:
      enabled: false
      ttl: 1h
      name: account_cache
    role:
      enabled: false
      ttl: 1h
      name: role_cache
    clientApplication:
      enabled: false
      ttl: 1h
      name: client_application_cache

  documentRepository:
    engine: s3
    bucketName: test
    fsBasePath: dist
    documentType:
      email:
        cacheName:
        cacheTtl: 1m
      staticAsset:
        cacheName:
        cacheTtl: 1m

  mfa:
    otp:
      otpLength: 6
      otpTimeToLiveInSeconds: 30

  # How long a ticket (the one-time proof behind MFA enrollment, reset-password
  # and email-verification links) can be redeemed, as Spring durations.
  ticket:
    ttl:
      mfaEnrollment: 5m
      resetPassword: 15m
      emailVerification: 24h

  assetServer:
    onS3:
      enabled: false
      bundleVersion: ""
    baseUrl: http://localhost:8080

  events:
    enableLoggerConsumer: false

  aws:
    s3:
      endpointOverride:
    kms:
      endpointOverride:
    sns:
      endpointOverride:
    lambda:
      endpointOverride:

  lambda:
    aws:
      enabled: false
      functionName: vauthenticator-token-enhancer
      functionResultCacheTtl: 10s
