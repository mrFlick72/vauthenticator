apiVersion: v1
kind: Service
metadata:
  name: {{ include "management-ui.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "management-ui.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      name: http
  selector:
    {{- include "management-ui.selectorLabels" . | nindent 4 }}
