{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "management-ui.name" . }}
  labels:
    {{- include "management-ui.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.httpRoute.gatewayClassName }}
  listeners:
    {{- range $index, $hostname := .Values.httpRoute.hostnames }}
    - name: https-{{ $index }}
      protocol: HTTPS
      port: {{ $.Values.httpRoute.gatewayPort }}
      hostname: {{ $hostname | quote }}
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          {{- range $.Values.httpRoute.tls }}
          - name: {{ .secretName }}
          {{- end }}
    {{- end }}
{{- end }}
