{{- if .Values.httpRoute.enabled -}}
{{- if .Values.ingress.enabled -}}
{{- fail "ingress.enabled and httpRoute.enabled are mutually exclusive: enable only one routing mechanism" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "management-ui.name" . }}
  labels:
    {{- include "management-ui.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ include "management-ui.name" . }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    - matches:
        {{- toYaml .matches | nindent 8 }}
      backendRefs:
        - name: {{ include "management-ui.name" $ }}
          port: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
